cv:
  name: Yetang Chen
  label: Undergraduate Researcher
  email: ""
  location: Xi'an, China
  image: ""
  summary: Undergraduate student in Computer Science and Technology at Xi'an University of Posts and Telecommunications, ranked 1st among 218 students with an average score of 94/100. Research interests include medical image analysis, computer vision, object detection, and multimodal perception.

  social_networks:
    - network: GitHub
      username: SiliconSisyphus

