        start_date: 2023
        end_date: Present
        score: "94/100; Major Rank: 1/218 (first five semesters)"
        highlights:
          - Currently in the second semester of junior year
          - National Scholarship recipient

    Research Experience:
      - company: Multi-center Hip X-ray Intelligent Detection Project
        position: Student Lead
        location: Xi'an, China
        start_date: 2024-03
        end_date: Present
        summary: Collaborative clinical research with Xi'an Honghui Hospital and Shandong Qilu Hospital, focusing on deep-learning-based detection of hip osteophytes from X-ray images.
        highlights:
          - Led algorithm design and dataset construction
          - Achieved 97.7% mAP@0.50 on the internal test set and 92.4% on an external hospital validation set
          - One SCI manuscript under review and one national invention patent application filed

      - company: State Key Laboratory of Fire Science, University of Science and Technology of China
        position: Research Member
        location: Hefei, China
        start_date: 2023-10
        end_date: 2025-01
        summary: Conducted multimodal data collection and algorithm research in controlled indoor-fire experiments.
        highlights:
          - Helped construct the first continuous multimodal indoor-fire detection dataset combining video and physical sensing data
          - Participated in controlled fire experiments, multimodal data acquisition, and algorithm development
          - The dataset has been released publicly

    Publications:
